<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf5ee">
  <meta name="description" content="一张简单的待办清单，帮你安排日常任务。">
  <title>清单 · 我的待办</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg aria-hidden="true" class="symbols" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="icon-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18M8 15h2m4 0h2"/></symbol>
    <symbol id="icon-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="m15.5 5.5 3 3M4 20l4.5-1 11-11a2.12 2.12 0 0 0-3-3l-11 11L4 20Z"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-spark" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M5 5l14 14m0-14L5 19"/></symbol>
  </svg>

  <div class="workspace">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"><svg aria-hidden="true" class="icon"><use href="#icon-check"></use></svg></span>
        <span>清单</span>
      </div>

      <nav class="views" aria-label="任务视图">
        <p class="nav-caption">任务视图</p>
        <button class="view active" type="button" data-view="all" aria-current="page">
          <svg aria-hidden="true" class="icon"><use href="#icon-list"></use></svg><span>所有任务</span><span class="view-count" data-count="all">0</span>
        </button>
        <button class="view" type="button" data-view="today">
          <svg aria-hidden="true" class="icon"><use href="#icon-calendar"></use></svg><span>今日到期</span><span class="view-count" data-count="today">0</span>
        </button>
        <button class="view" type="button" data-view="important">
          <svg aria-hidden="true" class="icon"><use href="#icon-star"></use></svg><span>重要任务</span><span class="view-count" data-count="important">0</span>
        </button>
      </nav>

      <div class="today-date">
        <svg aria-hidden="true" class="icon"><use href="#icon-calendar"></use></svg>
        <time id="today-date"></time>
      </div>
    </aside>

    <main class="content">
      <header class="page-header">
        <h1>我的今日待办</h1>
      </header>

      <section class="overview" aria-labelledby="overview-title">
        <div class="overview-content">
          <h2 id="overview-title">任务进度</h2>
          <p class="overview-summary">已完成 <strong id="completed-count">0</strong> / <span id="total-count">0</span> 项任务</p>
          <div class="progress-row">
            <progress id="progress" max="100" value="0" aria-label="任务完成比例"></progress>
            <span id="progress-percent">0%</span>
          </div>
        </div>
        <div class="hero-art" aria-hidden="true">
          <div class="hero-orbit"></div>
          <div class="hero-back-sheet"></div>
          <div class="hero-sheet">
            <span class="hero-clip"></span>
            <i class="sketch-row checked"></i>
            <i class="sketch-row checked"></i>
            <i class="sketch-row"></i>
          </div>
          <span class="hero-check"><svg aria-hidden="true" class="icon"><use href="#icon-check"></use></svg></span>
          <svg aria-hidden="true" class="icon hero-spark"><use href="#icon-spark"></use></svg>
          <span class="hero-dot"></span>
        </div>
      </section>

      <section class="tasks" aria-labelledby="tasks-title">
        <div class="tasks-header">
          <h2 id="tasks-title">所有任务</h2>
          <div class="filters" role="group" aria-label="按完成状态筛选">
            <button type="button" data-filter="all" aria-pressed="true">全部</button>
            <button type="button" data-filter="open" aria-pressed="false">待完成</button>
            <button type="button" data-filter="done" aria-pressed="false">已完成</button>
          </div>
        </div>

        <form class="task-entry" id="task-entry">
          <label class="sr-only" for="new-title">新任务名称</label>
          <input id="new-title" name="title" placeholder="接下来要做什么？" required maxlength="120" autocomplete="off">
          <button class="primary-button" type="submit">
            <svg aria-hidden="true" class="icon"><use href="#icon-plus"></use></svg>添加任务
          </button>
        </form>

        <ul class="task-list" id="task-list" aria-label="任务列表"></ul>
        <div class="empty" id="empty" hidden>
          <span class="empty-icon"><svg aria-hidden="true" class="icon"><use href="#icon-list"></use></svg></span>
          <p id="empty-message"></p>
        </div>
      </section>
    </main>
  </div>

  <dialog class="editor" id="editor" aria-labelledby="editor-title">
    <form class="editor-form" id="editor-form">
      <div class="editor-header">
        <h2 id="editor-title">编辑任务</h2>
        <button class="icon-button" type="button" data-close aria-label="关闭编辑">
          <svg aria-hidden="true" class="icon"><use href="#icon-close"></use></svg>
        </button>
      </div>
      <label class="field">任务名称<input id="edit-title" name="title" required maxlength="120" autofocus></label>
      <label class="field">截止日期<input id="edit-date" name="date" type="date"></label>
      <label class="priority-field"><input id="edit-priority" name="important" type="checkbox">标记为重要</label>
      <div class="editor-actions">
        <button class="secondary-button" type="button" data-close>取消</button>
        <button class="primary-button" type="submit">保存任务</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden>
    <span id="toast-message" role="status"></span>
    <button id="undo" type="button" hidden>撤销</button>
  </div>

  <template id="task-template">
    <li class="task">
      <label class="task-check">
        <input type="checkbox">
        <svg aria-hidden="true" class="icon"><use href="#icon-check"></use></svg>
      </label>
      <div class="task-detail">
        <span class="task-title"></span>
        <span class="task-date" hidden><svg aria-hidden="true" class="icon"><use href="#icon-calendar"></use></svg><time></time></span>
      </div>
      <span class="priority-badge" hidden><svg aria-hidden="true" class="icon"><use href="#icon-star"></use></svg>重要</span>
      <div class="task-actions">
        <button class="icon-button" type="button" data-action="edit" title="编辑">
          <svg aria-hidden="true" class="icon"><use href="#icon-edit"></use></svg>
        </button>
        <button class="icon-button remove-button" type="button" data-action="delete" title="删除">
          <svg aria-hidden="true" class="icon"><use href="#icon-trash"></use></svg>
        </button>
      </div>
    </li>
  </template>
</body>
</html>
